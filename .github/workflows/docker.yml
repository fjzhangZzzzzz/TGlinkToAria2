name: Docker Build and Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case owner name
        run: |
          echo "OWNER_LC=${OWNER,,}" >>${GITHUB_ENV}
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Extract version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary using builder image
        run: |
          docker run --rm \
            -v $(pwd):/app \
            ghcr.io/${{ env.OWNER_LC }}/tglink2aria2-cpp-builder:latest \
            bash -c "cd /app && mkdir -p build && cd build && cmake .. && make -j$(nproc)"

      - name: Build and push runtime image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/runtime.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/tglink2aria2-cpp:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.OWNER_LC }}/tglink2aria2-cpp:latest 